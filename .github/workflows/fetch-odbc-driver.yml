name: Fetch ODBC Driver Bundle (one-time)
on:
  workflow_dispatch:

jobs:
  fetch-driver:
    runs-on: ubuntu-22.04
    steps:
      - name: Install msodbcsql18 driver
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*mssql*.list
          sudo find /etc/apt/sources.list.d -name '*.sources' -exec grep -lq 'packages.microsoft.com' {} \; -delete 2>/dev/null || true
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc unixodbc-dev

          mkdir -p driver_files/opt/microsoft/msodbcsql18
          cp -r /opt/microsoft/msodbcsql18/lib64 driver_files/opt/microsoft/msodbcsql18/ 2>/dev/null || \
            cp -r /opt/microsoft/msodbcsql18/lib driver_files/opt/microsoft/msodbcsql18/lib64
          mkdir -p driver_files/etc
          sed 's|/opt/microsoft/msodbcsql18|/home/msodbc/opt/microsoft/msodbcsql18|g' /etc/odbcinst.ini > driver_files/etc/odbcinst.ini
          mkdir -p driver_files/usr/lib/x86_64-linux-gnu/odbc
          cp -r /usr/lib/x86_64-linux-gnu/odbc/* driver_files/usr/lib/x86_64-linux-gnu/odbc/ 2>/dev/null || true

      - name: Upload driver bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver_files
          path: driver_files/
