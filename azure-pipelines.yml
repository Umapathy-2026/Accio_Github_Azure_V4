trigger:
  branches:
    include:
      - DEV

pr: none

variables:
  webAppName: 'accio-demo-dev'
  serviceConnectionName: 'sc-azure-accio'
  pythonVersion: '3.12'
  artifactName: 'accio-app'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Install and package'
    pool:
      vmImage: 'ubuntu-22.04'
    steps:

    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - task: ArchiveFiles@2
      displayName: 'Zip application'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip'
        replaceExistingArchive: true
        excludePatterns: |
          **/__pycache__/**
          **/*.pyc
          .git/**
          instance/**

    - publish: '$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip'
      displayName: 'Publish artifact'
      artifact: '$(artifactName)'

- stage: Deploy
  displayName: 'Deploy to accio-dev'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAppService
    displayName: 'Deploy'
    environment: 'accio-dev-env'
    pool:
      vmImage: 'ubuntu-22.04'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureWebApp@1
            displayName: 'Deploy to $(webAppName)'
            inputs:
              azureSubscription: '$(serviceConnectionName)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName)-$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.12'
              startUpCommand: 'startup.sh'
              deploymentMethod: 'auto'